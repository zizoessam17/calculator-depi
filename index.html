<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="style.css">
    
    <title>Document</title>
</head>
<body>
    
    <div class=" vh-100 d-flex justify-content-center align-items-center shadow p-3 align-items-center">
        <div class="card d-flex justify-content-center align-items-center w-50  ">
           <input type="text" class="form-control mb-3 p-3" placeholder="Enter a number">

        
        <div class="row gap-3 container-fluid ">


        <div class="col d-flex flex-column gap-2">
                <button class="btn btn-light w-100 btn-calc border-dark " >7</button>
                <button class="btn btn-light w-100 btn-calc border-dark" >4</button>
                <button class="btn btn-light w-100 btn-calc border-dark" >1</button>
                <button  class="btn btn-light w-100 btn-calc border-dark">0</button>
        </div>

    <div class="col d-flex flex-column gap-2">
        <button class="btn btn-light w-100 btn-calc border-dark" >8</button>
        <button class="btn btn-light w-100 btn-calc border-dark" >5</button>
        <button class="btn btn-light w-100 btn-calc border-dark" >2</button>
        <button class="btn btn-light w-100 btn-calc border-dark" >.</button>
    </div>
    <div class="col d-flex flex-column gap-2">
        <button class="btn btn-light w-100 btn-calc border-dark" >9</button>
        <button class="btn btn-light w-100 btn-calc border-dark" >6</button>
        <button class="btn btn-light w-100 btn-calc border-dark" >3</button>
        <button class="btn btn-light w-100 btn-calc border-dark " >C</button>
    </div>
    <div class="col d-flex flex-column gap-2">
        <button class="btn btn-warning w-100 btn-calc" > x </button>
        <button class="btn btn-warning w-100 btn-calc" > + </button>
        <button class="btn btn-warning w-100 btn-calc" > - </button>
        <button class="btn btn-warning w-100 btn-calc"> = </button>


    
    </div>
  </div>
</div>
</div>
<script src="index.js"></script>
</body>
</html>
